<script>

const db={
  async getSetting(k){try{const r=await fetch(`${SB_URL}/rest/v1/settings?key=eq.${k}&select=value`,{headers:SBH});const d=await r.json();return d[0]?.value||null;}catch{return null;}},
  async setSetting(k,v){try{await fetch(`${SB_URL}/rest/v1/settings`,{method:'POST',headers:{...SBH,'Prefer':'resolution=merge-duplicates'},body:JSON.stringify({key:k,value:v,updated_at:new Date().toISOString()})});}catch(e){console.error(e);}},
  async getClients(){try{const r=await fetch(`${SB_URL}/rest/v1/clients?select=*&order=created_at.desc`,{headers:SBH});const d=await r.json();return Array.isArray(d)?d.map(x=>x.data).filter(Boolean):[];}catch{return[];}},
  async getCampaigns(){try{const r=await fetch(`${SB_URL}/rest/v1/campaigns?select=*&order=created_at.desc`,{headers:SBH});const d=await r.json();return Array.isArray(d)?d.map(x=>x.data).filter(Boolean):[];}catch{return[];}},
  async getContacts(){try{const r=await fetch(`${SB_URL}/rest/v1/contacts?select=*&order=created_at.desc`,{headers:SBH});const d=await r.json();return Array.isArray(d)?d.map(x=>x.data).filter(Boolean):[];}catch{return[];}},
  async upsertContact(c){try{await fetch(`${SB_URL}/rest/v1/contacts`,{method:'POST',headers:{...SBH,'Prefer':'resolution=merge-duplicates'},body:JSON.stringify({id:c.id,updated_at:c.updatedAt,client_id:c.clientId||null,stage:c.stage,score:c.score,data:c})});}catch(e){console.error(e);}},
  async deleteContact(id){try{await fetch(`${SB_URL}/rest/v1/contacts?id=eq.${id}`,{method:'DELETE',headers:SBH});}catch(e){console.error(e);}},
};

const C={bg:'#05080f',s1:'#0a1020',s2:'#0e1830',s3:'#13213e',s4:'#071526',bd:'#17304e',bdB:'#1d4070',ac:'#4a86f5',tx:'#cfe0f5',dm:'#5a8ab0',mt:'#274466',ok:'#34d399',wn:'#fbbf24',er:'#f87171',pu:'#a78bfa',tl:'#2dd4bf',or:'#fb923c'};
const inp=(ex={})=>({background:C.s2,border:`0.5px solid ${C.bd}`,borderRadius:6,color:C.tx,padding:'8px 11px',fontSize:13,width:'100%',outline:'none',...ex});
const pbtn=(on,ex={})=>({background:on?C.ac:'transparent',color:on?'#fff':C.tx,border:on?'none':`0.5px solid ${C.bd}`,borderRadius:6,padding:'7px 14px',fontSize:13,cursor:'pointer',...ex});
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const now=()=>new Date().toISOString();
const fmtd=d=>d?new Date(d).toLocaleDateString('en-MY',{day:'numeric',month:'short',year:'numeric'}):'—';
const fmtdt=d=>d?new Date(d).toLocaleString('en-MY',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
const fmtrel=d=>{if(!d)return'Never';const s=Math.floor((Date.now()-new Date(d))/1000);if(s<60)return'Just now';if(s<3600)return`${Math.floor(s/60)}m ago`;if(s<86400)return`${Math.floor(s/3600)}h ago`;if(s<604800)return`${Math.floor(s/86400)}d ago`;return fmtd(d);};

function parseCSV(text){const lines=text.trim().split(/\r?\n/);if(lines.length<2)return{headers:[],rows:[]};const pr=l=>{const r=[];let cur='',inQ=false;for(let i=0;i<l.length;i++){const c=l[i];if(c==='"'){if(inQ&&l[i+1]==='"'){cur+='"';i++;}else{inQ=!inQ;}}else if(c===','&&!inQ){r.push(cur.trim());cur='';}else{cur+=c;}}r.push(cur.trim());return r;};const hdrs=pr(lines[0]);const rows=lines.slice(1).filter(l=>l.trim()).map(l=>{const v=pr(l);const o={};hdrs.forEach((h,i)=>{o[h]=v[i]||'';});return o;});return{headers:hdrs,rows};}
function normPhone(raw){if(!raw)return'';const d=raw.replace(/[\s\-\(\)\.]/g,'');if(d.startsWith('+'))return d;if(d.startsWith('60'))return'+'+d;if(d.startsWith('0'))return'+6'+d;if(d.startsWith('6'))return'+60'+d.slice(1);return d;}
function validEmail(e){return/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e||'');}
function detectCol(hdrs,kws){return hdrs.find(h=>kws.some(k=>h.toLowerCase().includes(k)))||null;}

const STAGES=['lead','qualified','proposal','active','churned'];
const STAGE_META={lead:{l:'Lead',c:C.dm,bg:'#27446620'},qualified:{l:'Qualified',c:C.ac,bg:'#4a86f515'},proposal:{l:'Proposal',c:C.pu,bg:'#a78bfa15'},active:{l:'Active',c:C.ok,bg:'#34d39915'},churned:{l:'Churned',c:C.er,bg:'#f8717115'}};
const SCORES=['cold','warm','hot','vip'];
const SCORE_META={cold:{l:'Cold',c:C.dm,icon:'🧊'},warm:{l:'Warm',c:C.wn,icon:'🔥'},hot:{l:'Hot',c:C.or,icon:'🚨'},vip:{l:'VIP',c:C.pu,icon:'⭐'}};
const SOURCES=['Instagram DM','Facebook Ad','TikTok','WhatsApp','Referral','Walk-in','Email','Shopee','Lazada','LinkedIn','Website','Other'];
const ACTIVITY_TYPES=['Note','Call','Email','WhatsApp','Meeting'];
const ACTIVITY_ICONS={Note:'📝',Call:'📞',Email:'📧',WhatsApp:'💬',Meeting:'🤝'};

function blankContact(){
  return {id:uid(),createdAt:now(),updatedAt:now(),clientId:'',clientName:'',campaignId:'',campaignName:'',name:'',email:'',phone:'',company:'',source:'',track:'B2C',stage:'lead',score:'cold',dealValue:'',notes:'',tags:[],activities:[],lastContactedAt:null,scoreReason:''};
}

function StageBadge({stage,size='sm'}){const m=STAGE_META[stage]||STAGE_META.lead;return html`<span style=${{background:m.bg,color:m.c,border:`0.5px solid ${m.c}50`,borderRadius:20,padding:size==='lg'?'4px 14px':'2px 10px',fontSize:size==='lg'?12:11,fontWeight:500,whiteSpace:'nowrap'}}>${m.l}</span>`;}
function ScoreBadge({score}){const m=SCORE_META[score]||SCORE_META.cold;return html`<span style=${{background:`${m.c}15`,color:m.c,border:`0.5px solid ${m.c}40`,borderRadius:20,padding:'2px 9px',fontSize:11,fontWeight:500,whiteSpace:'nowrap'}}>${m.icon} ${m.l}</span>`;}
function Lb({children}){return html`<div style=${{fontSize:11,color:C.dm,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:5}}>${children}</div>`;}
function Fd({label,span2,req,children}){return html`<div style=${{gridColumn:span2?'span 2':'span 1'}}><div style=${{fontSize:11,color:C.dm,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:5,display:'flex',gap:4}}>${label}${req&&html`<span style=${{color:C.er}}>*</span>`}</div>${children}</div>`;}
function Card({style={},children}){return html`<div style=${{background:C.s1,border:`0.5px solid ${C.bd}`,borderRadius:10,...style}}>${children}</div>`;}
function Sec({t,children,action}){return html`<div style=${{marginBottom:20}}><div style=${{fontSize:11,color:C.ac,textTransform:'uppercase',letterSpacing:'1px',marginBottom:11,paddingBottom:7,borderBottom:`0.5px solid ${C.bd}`,display:'flex',justifyContent:'space-between',alignItems:'center'}}><span>${t}</span>${action||''}</div>${children}</div>`;}
function Spinner(){return html`<div style=${{display:'flex',alignItems:'center',justifyContent:'center',gap:10,padding:'40px',color:C.dm,fontSize:13}}><div style=${{width:18,height:18,border:`2px solid ${C.bd}`,borderTop:`2px solid ${C.ac}`,borderRadius:'50%',animation:'spin 0.8s linear infinite'}}></div>Loading…</div>`;}

function App(){
  const[locked,setLocked]=useState(true);
  const[pin,setPin]=useState('');const[pErr,setPErr]=useState('');const[savedPin,setSavedPin]=useState(null);const[pmode,setPmode]=useState('check');const[pin2,setPin2]=useState('');
  const[clients,setClients]=useState([]);
  const[campaigns,setCampaigns]=useState([]);
  const[contacts,setContacts]=useState([]);
  const[loading,setLoading]=useState(true);
  const[view,setView]=useState('contacts');
  const[form,setForm]=useState(null);
  const[det,setDet]=useState(null);
  const[srch,setSrch]=useState('');
  const[filterClient,setFilterClient]=useState('all');
  const[filterStage,setFilterStage]=useState('all');
  const[filterScore,setFilterScore]=useState('all');
  const[saving,setSaving]=useState(false);
  const[scoring,setScoring]=useState(false);
  const[toast,setToast]=useState('');const[toastType,setToastType]=useState('ok');
  // blast state
  const[blastClient,setBlastClient]=useState('');
  const[blastStage,setBlastStage]=useState('all');
  const[blastScore,setBlastScore]=useState('all');
  const[blastSubject,setBlastSubject]=useState('');
  const[blastBody,setBlastBody]=useState('');
  const[blastFrom,setBlastFrom]=useState('');
  const[blastSending,setBlastSending]=useState(false);
  // settings
  const[senderEmail,setSenderEmail]=useState('');
  const[senderName,setSenderName]=useState('');
  // activity
  const[actType,setActType]=useState('Note');
  const[actNote,setActNote]=useState('');
  // import
  const[importRows,setImportRows]=useState([]);
  const[importClientId,setImportClientId]=useState('');
  const[importClientName,setImportClientName]=useState('');
  const[importing,setImporting]=useState(false);
  const[importResult,setImportResult]=useState(null);

  useEffect(()=>{(async()=>{
    const p=await db.getSetting('pin');if(p)setSavedPin(p);else setPmode('create');
    const se=await db.getSetting('sender_email');if(se)setSenderEmail(se);
    const sn=await db.getSetting('sender_name');if(sn)setSenderName(sn);
    const cl=await db.getClients();setClients(cl);
    const ca=await db.getCampaigns();setCampaigns(ca);
    const co=await db.getContacts();setContacts(co);
    setLoading(false);
  })();},[]);

  const showToast=(msg,t='ok')=>{setToast(msg);setToastType(t);setTimeout(()=>setToast(''),3500);};
  const sf=(f,v)=>setForm(p=>({...p,[f]:v}));

  function doPin(){
    if(pmode==='create'){if(pin.length<4){setPErr('Min 4 chars');return;}if(pin!==pin2){setPErr('PINs do not match');return;}db.setSetting('pin',pin);setSavedPin(pin);setLocked(false);}
    else{if(pin===savedPin){setLocked(false);setPErr('');}else{setPErr('Incorrect PIN');setPin('');}}
  }

  function goBack(){
    if(view==='detail'||view==='new'||view==='edit'){setView('contacts');setForm(null);setDet(null);}
  }

  function selectClient(id){
    const c=clients.find(x=>x.id===id);
    if(!c){sf('clientId','');sf('clientName','');return;}
    sf('clientId',id);sf('clientName',c.basics.brandName||c.basics.clientName);
  }

  async function brevoSync(contact){
    if(!contact.email)return;
    try{
      await fetch(N8N_BREVO,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(contact)});
    }catch(e){console.warn('Brevo sync failed:',e.message);}
  }

  async function saveContact(){
    if(!form.name.trim()){showToast('Contact name required','er');return;}
    setSaving(true);
    const record={...form,updatedAt:now()};
    await db.upsertContact(record);
    brevoSync(record);
    const co=await db.getContacts();setContacts(co);
    setSaving(false);
    if(view==='detail'){setDet(record);setView('detail');}
    else{setView(det?'detail':'contacts');setForm(null);}
    showToast(view==='new'?'Contact added ✓ (syncing to Brevo…)':'Changes saved ✓ (syncing to Brevo…)','ok');
  }

  function handleCSV(e){
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      const{headers,rows}=parseCSV(ev.target.result);
      const colName=detectCol(headers,['name','full name','contact name']);
      const colEmail=detectCol(headers,['email']);
      const colPhone=detectCol(headers,['phone','contact','mobile','number','whatsapp']);
      const colSource=detectCol(headers,['source','from','channel','event','where']);
      const colTitan=detectCol(headers,['titan','machine','before','used']);
      const colConsent=detectCol(headers,['communic','receive','consent','opt','future']);
      const colTs=detectCol(headers,['timestamp','date','time','created']);
      const existingEmails=new Set(contacts.map(c=>(c.email||'').toLowerCase()));
      const csvEmails=new Set();
      const parsed=rows.map(row=>{
        const name=(colName?row[colName]:'').trim();
        const email=(colEmail?row[colEmail]:'').trim().toLowerCase();
        const phone=normPhone(colPhone?row[colPhone]:'');
        const source=(colSource?row[colSource]:'').trim();
        const titanRaw=(colTitan?row[colTitan]:'').trim().toLowerCase();
        const titan=titanRaw.startsWith('y')?'yes':titanRaw.startsWith('n')?'no':'';
        const consentRaw=(colConsent?row[colConsent]:'').trim().toLowerCase();
        const consent=consentRaw.startsWith('y')?'yes':consentRaw.startsWith('n')?'no':'unknown';
        const tsRaw=colTs?row[colTs]:'';
        let createdAt=now();if(tsRaw){const d=new Date(tsRaw);if(!isNaN(d))createdAt=d.toISOString();}
        const issues=[];let status='ok';
        if(consent==='no'){return{name,email,phone,source,titan,consent,score:'cold',createdAt,status:'skip',issues:['No consent — excluded (PDPA)']};}
        if(!name){issues.push('Name missing');status='error';}
        if(!email){issues.push('Email missing');status='error';}
        else if(!validEmail(email)){issues.push('Invalid email');status='error';}
        else if(existingEmails.has(email)){issues.push('Already in CRM');status='skip';}
        else if(csvEmails.has(email)){issues.push('Duplicate in CSV');status='skip';}
        else{csvEmails.add(email);}
        if(phone&&(phone.length<10||phone.length>16)){issues.push('Phone may be invalid');if(status==='ok')status='warn';}
        const isIntl=phone&&phone.startsWith('+')&&!phone.startsWith('+60');
        if(isIntl){issues.push('International number — flagged');if(status==='ok')status='warn';}
        const score=titan==='yes'?'warm':'cold';
        return{name,email,phone,source,titan,consent,score,isIntl:!!isIntl,createdAt,status,issues};
      });
      setImportRows(parsed);
    };
    reader.readAsText(file);
  }

  async function runImport(){
    const valid=importRows.filter(r=>r.status==='ok'||r.status==='warn');
    if(!valid.length){showToast('No valid rows to import','er');return;}
    if(!importClientId){showToast('Select a client first','er');return;}
    setImporting(true);
    let done=0,failed=0;
    for(const r of valid){
      const contact={...blankContact(),id:uid(),name:r.name,email:r.email,phone:r.phone,source:r.source||'',clientId:importClientId,clientName:importClientName,track:'B2C',stage:'lead',score:r.score,scoreReason:r.titan==='yes'?'Existing Titan user':'New to Titan',createdAt:r.createdAt,updatedAt:now(),notes:[r.titan?`Titan user: ${r.titan}`:'',`PDPA consent: ${r.consent}`,r.isIntl?'International number':''  ].filter(Boolean).join(' | ')};
      try{await db.upsertContact(contact);brevoSync(contact);done++;}catch(e){failed++;}
    }
    const co=await db.getContacts();setContacts(co);
    setImporting(false);
    setImportResult({done,failed,skipped:importRows.filter(r=>r.status==='skip'||r.status==='error').length});
    showToast(`Imported ${done} contacts ✓`,'ok');
  }

  async function deleteContact(id){
    if(!confirm('Delete this contact? Cannot be undone.'))return;
    await db.deleteContact(id);
    const co=await db.getContacts();setContacts(co);
    setView('contacts');setDet(null);setForm(null);
    showToast('Contact deleted','ok');
  }

  async function updateStage(id,stage){
    const c=contacts.find(x=>x.id===id);if(!c)return;
    const updated={...c,stage,updatedAt:now()};
    await db.upsertContact(updated);
    const co=await db.getContacts();setContacts(co);
    if(det?.id===id){setDet(co.find(x=>x.id===id));}
    showToast(`Stage → ${STAGE_META[stage]?.l}`,'ok');
  }

  async function addActivity(){
    if(!actNote.trim()){showToast('Add a note first','er');return;}
    const act={id:uid(),type:actType,note:actNote,createdAt:now()};
    const updated={...det,activities:[act,...(det.activities||[])],lastContactedAt:now(),updatedAt:now()};
    await db.upsertContact(updated);
    const co=await db.getContacts();setContacts(co);
    setDet(co.find(x=>x.id===det.id));
    setActNote('');
    showToast('Activity logged ✓','ok');
  }

  async function scoreWithAI(){
    if(!det)return;
    setScoring(true);
    const prompt=`You are a CRM analyst. Based on the contact information and activity below, assign a lead score.

Contact: ${det.name}
Company: ${det.company||'N/A'}
Source: ${det.source||'Unknown'}
Stage: ${STAGE_META[det.stage]?.l}
Notes: ${det.notes||'None'}
Recent activities: ${(det.activities||[]).slice(0,5).map(a=>`[${a.type}] ${a.note}`).join(' | ')||'None'}
Deal value: ${det.dealValue||'Not specified'}

Choose ONE score from: Cold, Warm, Hot, VIP
- Cold: Not engaged, low intent, no response
- Warm: Showing interest, some engagement
- Hot: Actively interested, ready to buy soon
- VIP: High-value, existing client or strong referral

Reply in this exact format:
SCORE: [Cold/Warm/Hot/VIP]
REASON: [One sentence explanation]`;
    try{
      const res=await fetch(N8N_PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system:'You are a CRM lead scoring analyst. Be concise and decisive.',prompt})});
      const rawText=await res.text();
      if(!rawText.trim())throw new Error('Empty response from AI');
      const data=JSON.parse(rawText);
      const text=(data?.content?.[0]?.text||data?.[0]?.content?.[0]?.text||data?.body?.content?.[0]?.text||'').trim();
      const scoreMatch=text.match(/SCORE:\s*(Cold|Warm|Hot|VIP)/i);
      const reasonMatch=text.match(/REASON:\s*(.+)/i);
      if(scoreMatch){
        const newScore=scoreMatch[1].toLowerCase();
        const reason=reasonMatch?reasonMatch[1].trim():'';
        const updated={...det,score:newScore,scoreReason:reason,updatedAt:now()};
        await db.upsertContact(updated);
        const co=await db.getContacts();setContacts(co);
        setDet(co.find(x=>x.id===det.id));
        showToast(`Scored: ${SCORE_META[newScore]?.icon} ${SCORE_META[newScore]?.l}`,'ok');
      }else{showToast('Could not parse AI score — try again','wn');}
    }catch(e){showToast('AI scoring failed: '+e.message,'er');}
    setScoring(false);
  }

  const blastTargets=contacts.filter(c=>{
    const matchClient=!blastClient||c.clientId===blastClient;
    const matchStage=blastStage==='all'||c.stage===blastStage;
    const matchScore=blastScore==='all'||c.score===blastScore;
    return matchClient&&matchStage&&matchScore&&c.email;
  });

  async function sendBlast(){
    if(!blastTargets.length){showToast('No contacts with email match this filter','er');return;}
    if(!blastSubject.trim()||!blastBody.trim()){showToast('Subject and body required','er');return;}
    if(!confirm(`Send to ${blastTargets.length} contact${blastTargets.length>1?'s':''}?`))return;
    setBlastSending(true);
    try{
      const res=await fetch(N8N_EMAIL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
        from_name:senderName||'OmniraAI',
        from_email:senderEmail||'onboarding@resend.dev',
        to:blastTargets.map(c=>c.email),
        subject:blastSubject,
        body_html:blastBody.replace(/\n/g,'<br/>'),
      })});
      const rawText=await res.text();
      if(res.ok){showToast(`✓ Sent to ${blastTargets.length} contacts`,'ok');setBlastSubject('');setBlastBody('');}
      else{showToast('Send failed — check n8n logs','er');}
    }catch(e){showToast('Failed: '+e.message,'er');}
    setBlastSending(false);
  }

  const filtered=contacts.filter(c=>{
    const n=(c.name||'').toLowerCase()+(c.email||'').toLowerCase()+(c.company||'').toLowerCase();
    return(filterClient==='all'||c.clientId===filterClient)&&(filterStage==='all'||c.stage===filterStage)&&(filterScore==='all'||c.score===filterScore)&&(!srch||n.includes(srch.toLowerCase()));
  });

  const stats={
    total:contacts.length,
    hot:contacts.filter(c=>c.score==='hot'||c.score==='vip').length,
    active:contacts.filter(c=>c.stage==='active').length,
    new:contacts.filter(c=>{const d=new Date(c.createdAt);return(Date.now()-d)<7*86400000;}).length,
  };

  const G={display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px 18px'};

  // ── PIN ─────────────────────────────────────────────────────────
  if(locked)return html`

            <div style=${{display:'flex',flexDirection:'column',gap:10}}>
              <div><${Lb}>Client</${Lb}><select style=${inp()} value=${blastClient} onChange=${e=>setBlastClient(e.target.value)}><option value="">All clients</option>${clients.map(c=>html`<option key=${c.id} value=${c.id}>${c.basics.brandName||c.basics.clientName}</option>`)}</select></div>
              <div><${Lb}>Stage</${Lb}><select style=${inp()} value=${blastStage} onChange=${e=>setBlastStage(e.target.value)}><option value="all">All stages</option>${STAGES.map(s=>html`<option key=${s} value=${s}>${STAGE_META[s].l}</option>`)}</select></div>
              <div><${Lb}>Score</${Lb}><select style=${inp()} value=${blastScore} onChange=${e=>setBlastScore(e.target.value)}><option value="all">All scores</option>${SCORES.map(s=>html`<option key=${s} value=${s}>${SCORE_META[s].icon} ${SCORE_META[s].l}</option>`)}</select></div>
            </div>
          </${Sec}>
          <div style=${{background:blastTargets.length>0?`${C.ok}0d`:`${C.er}0d`,border:`0.5px solid ${blastTargets.length>0?C.ok:C.er}40`,borderRadius:7,padding:'11px 14px',fontSize:13}}>
            <span style=${{color:blastTargets.length>0?C.ok:C.dm,fontWeight:600}}>${blastTargets.length} contact${blastTargets.length!==1?'s':''}</span>
            <span style=${{color:C.dm}}> with email match filter</span>
          </div>
          ${blastTargets.length>0&&html`<div style=${{marginTop:10,maxHeight:160,overflowY:'auto',display:'flex',flexDirection:'column',gap:4}}>
            ${blastTargets.map(c=>html`<div key=${c.id} style=${{fontSize:11,color:C.dm,padding:'4px 8px',background:C.s2,borderRadius:5}}>${c.name} — ${c.email}</div>`)}
          </div>`}
        </${Card}>
        <${Card} style=${{padding:18}}>
          <${Sec} t="Compose">
            <div style=${{display:'flex',flexDirection:'column',gap:12}}>
              <div><${Lb}>Subject</${Lb}><input style=${inp()} value=${blastSubject} onChange=${e=>setBlastSubject(e.target.value)} placeholder="Email subject line…"/></div>
              <div><${Lb}>Body</${Lb}><textarea style=${inp({resize:'vertical',minHeight:200})} value=${blastBody} onChange=${e=>setBlastBody(e.target.value)} placeholder="Write your email body here. Use plain text — line breaks are preserved.&#10;&#10;Hi {name},&#10;&#10;…"/></div>
              <div style=${{display:'flex',gap:8}}>
                <button onClick=${sendBlast} disabled=${blastSending||!blastTargets.length} style=${pbtn(true,{flex:1,fontWeight:500,opacity:!blastTargets.length?0.5:1})}>${blastSending?'Sending…':`Send to ${blastTargets.length} contact${blastTargets.length!==1?'s':''}`}</button>
              </div>
              <div style=${{fontSize:11,color:C.mt}}>Emails are sent via Resend.com through your n8n workflow. Replies go to your sender email.</div>
            </div>
          </${Sec}>
        </${Card}>
      </div>
    </div>`;

  // ── SETTINGS ──────────────────────────────────────────────────────
  const settingsView=html`
    <div style=${{maxWidth:680,margin:'0 auto',padding:'32px 24px'}}>
      <div style=${{fontSize:19,fontWeight:600,color:C.tx,marginBottom:28}}>Settings</div>
      <${Card} style=${{padding:24,marginBottom:14}}>
        <${Sec} t="Email sender (Resend.com)">
          <div style=${{display:'flex',flexDirection:'column',gap:10}}>
            <div style=${G}>
              <div><${Lb}>Sender name</${Lb}><input style=${inp()} value=${senderName} onChange=${e=>setSenderName(e.target.value)} placeholder="Jason | OmniraAI"/></div>
              <div><${Lb}>Sender email</${Lb}><input style=${inp()} value=${senderEmail} onChange=${e=>setSenderEmail(e.target.value)} placeholder="onboarding@resend.dev"/></div>
            </div>
            <button onClick=${async()=>{await Promise.all([db.setSetting('sender_email',senderEmail),db.setSetting('sender_name',senderName)]);showToast('Email settings saved ✓','ok');}} style=${pbtn(true,{fontSize:13,padding:'8px 20px',width:'fit-content'})}>Save</button>
            <div style=${{fontSize:11,color:C.mt,lineHeight:1.6}}>API key is stored securely in n8n. Use <span style=${{color:C.tx}}>onboarding@resend.dev</span> until you verify a custom domain in Resend → Domains.</div>
          </div>
        </${Sec}>
        <${Sec} t="n8n email webhook">
          <div style=${{padding:'10px 14px',background:C.s2,borderRadius:7,fontFamily:'monospace',fontSize:12,color:C.dm,wordBreak:'break-all'}}>${N8N_EMAIL}</div>
          <div style=${{fontSize:11,color:C.mt,marginTop:6}}>Create an n8n workflow at this path (Webhook → Code → Resend API call → Respond). See docs for the Code node template.</div>
        </${Sec}>
        <${Sec} t="Data connections">
          <div style=${{display:'flex',flexDirection:'column',gap:7}}>
            ${[['Clients',clients.length,'Brand Manager'],['Campaigns',campaigns.length,'Campaign Builder'],['Contacts',contacts.length,'This app']].map(([l,n,src])=>html`<div key=${l} style=${{display:'flex',alignItems:'center',gap:10,padding:'9px 13px',background:C.s2,borderRadius:7}}>
              <div style=${{width:7,height:7,borderRadius:'50%',background:n>0?C.ok:C.wn,flexShrink:0}}></div>
              <span style=${{fontSize:13,color:C.tx,flex:1}}>${l}</span>
              <span style=${{fontSize:12,color:C.dm}}>${n} records · ${src}</span>
            </div>`)}
          </div>
        </${Sec}>
      </${Card}>
    </div>`;

  const SC={ok:C.ok,warn:C.wn,skip:C.dm,error:C.er};
  const SL={ok:'Ready',warn:'Warning',skip:'Skip',error:'Error'};
  const importView=html`
    <div style=${{maxWidth:920,margin:'0 auto',padding:'24px',animation:'fadeIn 0.2s ease'}}>
      <div style=${{marginBottom:18}}>
        <div style=${{fontSize:19,fontWeight:600,color:C.tx}}>CSV Import</div>
        <div style=${{fontSize:13,color:C.dm,marginTop:3}}>Bulk import contacts from Google Sheets. Validates emails, normalises Malaysian phone numbers, auto-scores by Titan usage, skips duplicates.</div>
      </div>
      ${importResult?html`
        <${Card} style=${{padding:40,textAlign:'center'}}>
          <div style=${{fontSize:36,marginBottom:12}}>✅</div>
          <div style=${{fontSize:20,fontWeight:600,color:C.ok,marginBottom:8}}>Import complete</div>
          <div style=${{fontSize:14,color:C.dm,marginBottom:24}}>
            <strong style=${{color:C.ok}}>${importResult.done}</strong> imported · <strong style=${{color:C.dm}}>${importResult.skipped}</strong> skipped / errored · <strong style=${{color:importResult.failed>0?C.er:C.dm}}>${importResult.failed}</strong> failed
          </div>
          <div style=${{fontSize:12,color:C.dm,marginBottom:24}}>All imported contacts have been auto-synced to Brevo Titan B2C list.</div>
          <button style=${pbtn(true,{padding:'9px 24px'})} onClick=${()=>{setImportRows([]);setImportResult(null);}}>Import another file</button>
        </${Card}>
      `:importRows.length===0?html`
        <${Card} style=${{padding:24,marginBottom:14}}>
          <${Sec} t="1 — Select client for these contacts">
            <select style=${inp({maxWidth:380})} value=${importClientId} onChange=${e=>{const c=clients.find(x=>x.id===e.target.value);setImportClientId(e.target.value);setImportClientName(c?.basics?.brandName||c?.basics?.clientName||'');}}>
              <option value="">Select client…</option>
              ${clients.map(c=>html`<option key=${c.id} value=${c.id}>${c.basics.brandName||c.basics.clientName}</option>`)}
            </select>
          </${Sec}>
          <${Sec} t="2 — Upload CSV file">
            <div style=${{fontSize:12,color:C.dm,marginBottom:14,lineHeight:1.8}}>
              Export from Google Sheets: <strong style=${{color:C.tx}}>File → Download → Comma-separated values (.csv)</strong><br/>
              Expected columns: <span style=${{color:C.tx}}>Timestamp · Email Address · Name · Contact Number · Have you used a Titan ball machine before</span>
            </div>
            <label style=${{display:'block',border:`1.5px dashed ${C.bdB}`,borderRadius:10,padding:'40px 24px',textAlign:'center',cursor:'pointer',background:C.s2}}>
              <div style=${{fontSize:30,marginBottom:10}}>📂</div>
              <div style=${{fontSize:14,color:C.tx,fontWeight:500,marginBottom:4}}>Click to upload CSV</div>
              <div style=${{fontSize:12,color:C.dm}}>Headers must be in row 1</div>
              <input type="file" accept=".csv,.txt" style=${{display:'none'}} onChange=${handleCSV}/>
            </label>
          </${Sec}>
        </${Card}>
      `:html`
        ${(()=>{
          const valid=importRows.filter(r=>r.status==='ok'||r.status==='warn');
          const skip=importRows.filter(r=>r.status==='skip');
          const err=importRows.filter(r=>r.status==='error');
          return html`
            <${Card} style=${{padding:18}}>
              <div style=${{display:'flex',gap:12,marginBottom:16,flexWrap:'wrap',alignItems:'center'}}>
                <div style=${{background:`${C.ok}15`,border:`0.5px solid ${C.ok}40`,borderRadius:8,padding:'10px 18px',textAlign:'center',minWidth:80}}>
                  <div style=${{fontSize:22,fontWeight:700,color:C.ok}}>${valid.length}</div>
                  <div style=${{fontSize:11,color:C.dm}}>Will import</div>
                </div>
                <div style=${{background:`${C.dm}15`,border:`0.5px solid ${C.dm}40`,borderRadius:8,padding:'10px 18px',textAlign:'center',minWidth:80}}>
                  <div style=${{fontSize:22,fontWeight:700,color:C.dm}}>${skip.length}</div>
                  <div style=${{fontSize:11,color:C.dm}}>Skipped</div>
                </div>
                <div style=${{background:`${C.er}15`,border:`0.5px solid ${C.er}40`,borderRadius:8,padding:'10px 18px',textAlign:'center',minWidth:80}}>
                  <div style=${{fontSize:22,fontWeight:700,color:C.er}}>${err.length}</div>
                  <div style=${{fontSize:11,color:C.dm}}>Errors</div>
                </div>
                <div style=${{flex:1,display:'flex',gap:8,justifyContent:'flex-end',flexWrap:'wrap'}}>
                  <button style=${pbtn(false,{fontSize:12,padding:'7px 14px'})} onClick=${()=>setImportRows([])}>← Different file</button>
                  <button style=${pbtn(true,{fontSize:13,padding:'8px 22px',fontWeight:500,opacity:(!valid.length||!importClientId||importing)?0.5:1})} disabled=${importing||!valid.length||!importClientId} onClick=${runImport}>
                    ${importing?'Importing…':`Import ${valid.length} contacts →`}
                  </button>
                </div>
              </div>
              ${!importClientId&&html`<div style=${{fontSize:12,color:C.wn,marginBottom:12}}>⚠ Go back and select a client before importing.</div>`}
              <div style=${{overflowX:'auto'}}>
                <table style=${{width:'100%',borderCollapse:'collapse',fontSize:12}}>
                  <thead>
                    <tr style=${{borderBottom:`1px solid ${C.bd}`}}>
                      ${['Status','Name','Email','Phone','Source','Titan','Consent','Score','Notes'].map(h=>html`<th key=${h} style=${{padding:'6px 10px',textAlign:'left',color:C.dm,fontWeight:500,whiteSpace:'nowrap'}}>${h}</th>`)}
                    </tr>
                  </thead>
                  <tbody>
                    ${importRows.map((r,i)=>html`
                      <tr key=${i} style=${{borderBottom:`0.5px solid ${C.bd}20`,background:i%2?`${C.s2}50`:'transparent'}}>
                        <td style=${{padding:'5px 10px'}}>
                          <span style=${{background:`${SC[r.status]}15`,color:SC[r.status],border:`0.5px solid ${SC[r.status]}40`,borderRadius:20,padding:'2px 8px',fontSize:10,whiteSpace:'nowrap'}}>${SL[r.status]}</span>
                        </td>
                        <td style=${{padding:'5px 10px',color:r.name?C.tx:C.er}}>${r.name||'—'}</td>
                        <td style=${{padding:'5px 10px',color:validEmail(r.email)?C.tx:C.er}}>${r.email||'—'}</td>
                        <td style=${{padding:'5px 10px',color:C.dm,whiteSpace:'nowrap'}}>${r.phone||'—'}</td>
                        <td style=${{padding:'5px 10px',color:C.dm,whiteSpace:'nowrap'}}>${r.source||'—'}</td>
                        <td style=${{padding:'5px 10px',color:r.titan==='yes'?C.ok:C.dm}}>${r.titan||'—'}</td>
                        <td style=${{padding:'5px 10px',whiteSpace:'nowrap'}}>
                          <span style=${{color:r.consent==='yes'?C.ok:r.consent==='no'?C.er:C.dm}}>${r.consent==='yes'?'✓ Yes':r.consent==='no'?'✗ No':'—'}</span>
                        </td>
                        <td style=${{padding:'5px 10px',whiteSpace:'nowrap'}}>
                          <span style=${{color:r.score==='warm'?C.wn:C.dm}}>${r.score==='warm'?'🔥 Warm':'🧊 Cold'}</span>
                        </td>
                        <td style=${{padding:'5px 10px',color:C.dm}}>${r.issues.join(', ')||'—'}</td>
                      </tr>
                    `)}
                  </tbody>
                </table>
              </div>
            </${Card}>
          `;
        })()}
      `}
    </div>`;

  return html`
    <div style=${{minHeight:'100vh',background:C.bg,color:C.tx}}>
      <style>@keyframes spin{to{transform:rotate(360deg)}}@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}</style>
      ${hdr}
      <div style=${{paddingBottom:48}}>
        ${view==='contacts'&&contactsList}
        ${view==='pipeline'&&pipelineBoard}
        ${view==='detail'&&detailView}
        ${(view==='new'||view==='edit')&&contactForm}
        ${view==='blast'&&blastView}
        ${view==='import'&&importView}
        ${view==='settings'&&settingsView}
      </div>
      ${toast&&html`<div style=${{position:'fixed',bottom:24,right:24,background:C.s1,border:`1px solid ${toastType==='ok'?C.ok:toastType==='er'?C.er:C.wn}60`,borderRadius:8,padding:'10px 18px',fontSize:13,color:C.tx,zIndex:999,maxWidth:340,animation:'fadeIn 0.2s ease'}}>${toast}</div>`}
    </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
